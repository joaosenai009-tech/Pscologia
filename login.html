<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Psicóloga Maria Eduarda</title>
    <link rel="icon" type="image/jpeg" href="Imagens/Simbolo_Psicologia.jpg">
    <link rel="shortcut icon" href="Imagens/Simbolo_Psicologia.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-container">
        <div class="login-card">
            <img class="login-logo" src="/Testes/Teste 1/Imagens/Simbolo_Psicologia.jpg" alt="Logo da psicóloga">
            <h1>Login</h1>
            <p class="login-subtitle">Acesse sua conta</p>
            <form class="login-form">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@email.com" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                <button type="submit" class="login-btn">Entrar</button>
            </form>

            <p class="login-link">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
    </main>
</body>
</html>
